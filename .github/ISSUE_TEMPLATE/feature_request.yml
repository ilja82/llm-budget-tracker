name: Feature request
description: Suggest an idea for something new or better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for your idea. Please search the existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what is hard about it today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the app behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
    validations:
      required: false
