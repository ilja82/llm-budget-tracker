name: LLMBudgetTracker
options:
  bundleIdPrefix: com.ilja82
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true

targets:
  LLMBudgetTracker:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: LLMBudgetTracker
        excludes:
          - "*.entitlements"
    resources:
      - LLMBudgetTracker/Assets.xcassets
      - LLMBudgetTracker/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilja82.llm-budget-tracker
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS: LLMBudgetTracker/LLMBudgetTracker.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableDescription: "LLM Budget Tracker"
        INFOPLIST_KEY_CFBundleDisplayName: LLM Budget Tracker
        MARKETING_VERSION: "0.0.8"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ilja82.llm-budget-tracker.debug
          INFOPLIST_KEY_CFBundleDisplayName: LLM Budget Tracker (Debug)

  LLMBudgetTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LLMBudgetTrackerTests
      - path: LLMBudgetTracker/Models/ConnectionSettings.swift
      - path: LLMBudgetTracker/Services/EndpointSecurity.swift
      - path: LLMBudgetTracker/Services/APIService.swift
      - path: LLMBudgetTracker/Services/ResponseSanitizer.swift
      - path: LLMBudgetTracker/Models/BudgetInfo.swift
      - path: LLMBudgetTracker/Models/TeamMemberInfo.swift
      - path: LLMBudgetTracker/Models/KeyInfo.swift
      - path: LLMBudgetTracker/Models/TeamInfo.swift
      - path: LLMBudgetTracker/Models/SpendLog.swift
      - path: LLMBudgetTracker/Models/ChartSelection.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LLMBudgetTracker:
    build:
      targets:
        LLMBudgetTracker: all
    test:
      gatherCoverageData: true
      targets:
        - LLMBudgetTrackerTests
